version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      routine-updates:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 7
    groups:
      routine-updates:
        update-types:
          - minor
          - patch
    schedule:
      interval: weekly
